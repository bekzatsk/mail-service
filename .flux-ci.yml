# Flux CI pipeline for mail-service.
#
# Reference: https://flux.innlab.kz/docs/pipeline
#
# The service has no build step — it is Ruby served by Passenger plus a console
# of raw ES modules — so CI is about proving the thing still works and that no
# credential leaked, then mirroring the source to the host.
#
# Note on `changes:` — deliberately unused. A skipped job skips everything that
# needs it, and deploy-ftps needs all three checks, so path-filtering any of them
# would silently skip the deploy. The whole suite runs in well under a minute
# anyway, apart from the browser smoke test.

stages: [verify, test, deploy]

variables:
  # Plesk shared host. SSH does not answer, so FTPS is the only transport —
  # same arrangement as the other project on this host, which is why the
  # credentials are the shared org-scoped FLUX_FTP_USER / FLUX_FTP_PASS rather
  # than anything named for this service.
  #
  # This is a fallback only: a secret of the same name outranks this block, and
  # FLUX_FTP_HOST is defined as one. Note that a *protected* secret arrives as
  # an empty string on a non-protected ref and still overrides — which is why
  # the job guards this value rather than trusting the default below.
  FLUX_FTP_HOST: "185.116.195.70"
  # Directory under the FTP account's root. On this Plesk host that is a domain
  # name with no httpdocs level. It holds the whole checkout, including .env,
  # vendor/ and tmp/, which is why the mirror must never prune.
  MAIL_REMOTE_DIR: "email.innlab.kz"
  # Where the deployed service answers. The deploy refuses to run without it,
  # because a deploy nobody verified is not a deploy. A secret of the same name
  # overrides this.
  MAIL_SITE_URL: "https://email.innlab.kz"
  # Pinned: the smoke test is written against this Playwright API.
  PLAYWRIGHT_VERSION: "1.62.1"

# ── verify ──────────────────────────────────────────────────────────

ruby-syntax:
  stage: verify
  image: ruby:3.2-alpine
  script:
    - echo "checking $(find . -name '*.rb' -not -path './vendor/*' | wc -l) ruby files"
    # A loop, not `find -exec`: find exits 0 even when ruby -c fails, which would
    # take this job green on a syntax error.
    - for f in $(find . -name '*.rb' -not -path './vendor/*'); do ruby -c "$f" > /dev/null || exit 1; done
    - ruby -c config.ru > /dev/null
    - echo "ok    every ruby file parses"

pipeline-config:
  stage: verify
  image: ruby:3.2-alpine
  script:
    # Asserts this file's own invariants. Nothing else type-checks a pipeline,
    # and its mistakes only surface on a runner, against production.
    - ruby test/ci_config_test.rb

console-modules:
  stage: verify
  image: node:22-alpine
  script:
    - sh script/check-ui-modules.sh

secret-scan:
  stage: verify
  image: alpine:3.20
  script:
    - apk add --no-cache git > /dev/null
    # The runner clones into a fresh workspace; git ls-files needs to see it.
    - git config --global --add safe.directory "$PWD"
    - sh script/check-secrets.sh

# ── test ────────────────────────────────────────────────────────────

route-auth:
  stage: test
  image: ruby:3.2-alpine
  needs: [ruby-syntax]
  script:
    # Who may reach which route with which key — the security boundary of the
    # whole service. Runs without a bundle or a database by design.
    - ruby test/middleware_routes_test.rb
    # Guards the master key and the Telegram webhook secret token.
    - ruby test/secure_compare_test.rb

console-smoke:
  stage: test
  image: node:22-bookworm
  needs: [console-modules]
  script:
    - npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
    - npx playwright install --with-deps chromium
    - node test/ui_smoke_test.mjs

# ── deploy ──────────────────────────────────────────────────────────

deploy-ftps:
  stage: deploy
  image: alpine:3.20
  when: manual
  needs: [route-auth, console-smoke, secret-scan, pipeline-config]
  script:
    # A protected secret arrives as an empty string on a non-protected ref, so
    # the two ways this is unset — never defined, or defined but withheld from
    # this ref — look identical here and the message has to name both.
    - 'test -n "${FLUX_FTP_USER:-}" || { echo "FLUX_FTP_USER is empty. Define it under CI/CD -> Secrets, and if it is marked protected, run this from a protected ref."; exit 1; }'
    - 'test -n "${FLUX_FTP_PASS:-}" || { echo "FLUX_FTP_PASS is empty. Define it under CI/CD -> Secrets, and if it is marked protected, run this from a protected ref."; exit 1; }'
    - 'test -n "${FLUX_FTP_HOST:-}" || { echo "FLUX_FTP_HOST is empty. It is defined as a secret, and a protected secret overrides the fallback in this file with an empty string on a non-protected ref."; exit 1; }'
    - 'test -n "${MAIL_SITE_URL:-}" || { echo "MAIL_SITE_URL is not set. Set it to where the service answers, e.g. https://mail.example.com, so the deploy can verify itself."; exit 1; }'
    - apk add --no-cache lftp curl > /dev/null

    - 'echo "NOTE: gems are not shipped. If Gemfile changed, run bundle install on the host — FTPS cannot."'
    # Assert the target before uploading anything. Without this, a wrong
    # MAIL_REMOTE_DIR silently creates a directory nobody serves and the deploy
    # only fails later, at the health check, with nothing pointing at the cause.
    # cmd:fail-exit turns a failed lftp command into a non-zero exit.
    - echo ">> checking ftp://$FLUX_FTP_HOST/$MAIL_REMOTE_DIR is the live checkout"
    - 'LFTP_PASSWORD="$FLUX_FTP_PASS" lftp -u "$FLUX_FTP_USER" --env-password "ftp://$FLUX_FTP_HOST" -e "set ftp:ssl-allow yes; set ftp:ssl-force yes; set ssl:verify-certificate no; set cmd:fail-exit yes; set net:timeout 20; cd $MAIL_REMOTE_DIR; cls -1 config.ru; bye" || { echo "FAILED: ftp://$FLUX_FTP_HOST/$MAIL_REMOTE_DIR does not exist or holds no config.ru - check MAIL_REMOTE_DIR"; exit 1; }'

    - echo ">> mirroring $PWD -> ftp://$FLUX_FTP_HOST/$MAIL_REMOTE_DIR"

    # No --delete: the server holds .env, vendor/bundle and tmp/, none of which
    # are in this repo. A mirror that pruned would take the service down.
    # Passenger reloads when tmp/restart.txt changes, so that goes up last.
    - printf '' > /tmp/restart.txt
    # One physical line, on purpose. This was a folded (>) block, and YAML keeps
    # the newlines of more-indented lines inside one - so lftp saw "mirror" and
    # each "--exclude-glob" as separate commands. A bare "mirror --reverse" takes
    # the current directories on both sides: it uploaded the entire workspace,
    # .git included, into the FTP account root.
    - EXCLUDES="--exclude-glob .git/ --exclude-glob .idea/ --exclude-glob .claude-flow/ --exclude-glob node_modules/ --exclude-glob vendor/ --exclude-glob tmp/ --exclude-glob test/ --exclude-glob script/ --exclude-glob .env --exclude-glob .flux-ci.yml"
    # cd before mirror, and name both source and target explicitly, so even a
    # mangled option list cannot land the upload anywhere but the target.
    - 'LFTP_PASSWORD="$FLUX_FTP_PASS" lftp -u "$FLUX_FTP_USER" --env-password "ftp://$FLUX_FTP_HOST" -e "set ftp:ssl-allow yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; set cmd:fail-exit yes; set net:timeout 20; set net:max-retries 3; cd $MAIL_REMOTE_DIR; mirror --reverse --verbose --parallel=4 $EXCLUDES . .; mkdir -p -f tmp; put /tmp/restart.txt -o tmp/restart.txt; bye"'

    # A mirror that uploaded fine but left the old process running is still a
    # failed deploy, so gate on what the site actually answers.
    - echo ">> waiting for Passenger to pick up the new code"
    - code=""
    - >
      for attempt in 1 2 3 4 5 6; do
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$MAIL_SITE_URL/organizations" || true);
        if [ "$code" = "401" ]; then break; fi;
        echo "   attempt $attempt: got ${code:-no response}, expected 401";
        sleep 5;
      done
    - 'test "$code" = "401" || { echo "FAILED: $MAIL_SITE_URL/organizations returned ${code:-nothing}, expected 401 — the app did not come back, or auth is not enforced"; exit 1; }'
    - echo "ok    API up and rejecting unauthenticated reads"

    # And the console itself — it ships as static files, so a broken mirror shows
    # up here rather than the first time somebody opens the panel.
    - 'curl -fsS --max-time 30 "$MAIL_SITE_URL/ui/" | grep -q "mail·svc console" || { echo "FAILED: $MAIL_SITE_URL/ui/ did not serve the console"; exit 1; }'
    - echo "ok    admin console served at $MAIL_SITE_URL/ui/"
    - echo ">> deployed $CI_COMMIT_SHORT_SHA"
